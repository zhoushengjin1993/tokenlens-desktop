[package]
name = "tokenlens-desktop"
version = "0.1.0"
description = "Cross-client AI Agent per-turn token monitor companion"
authors = ["zhoushengjin1993"]
edition = "2021"

[lib]
name = "tokenlens_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-global-shortcut = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
